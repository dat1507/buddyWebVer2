[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vgu-buddy-api"
version = "0.1.0"
description = "FastAPI backend for the VGU Student Companion Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0,<2.0.0",
  "asyncpg>=0.31.0,<1.0.0",
  "bcrypt>=5.0.0,<6.0.0",
  "cryptography>=50.0.0,<51.0.0",
  "fastapi>=0.141.1,<1.0.0",
  "limits[redis]>=5.8.0,<6.0.0",
  "pillow>=12.0.0,<13.0.0",
  "pyjwt>=2.14.0,<3.0.0",
  "pydantic>=2.12.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.0,<2.1.0",
  "slowapi>=0.1.10,<0.2.0",
  "tzdata>=2025.2,<2027.0",
  "uvicorn[standard]>=0.52.4,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.3.0,<2.0.0",
  "httpx2>=2.12.0,<3.0.0",
  "mypy>=2.3.1,<3.0.0",
  "pip-audit>=2.9.0,<3.0.0",
  "pip-tools>=7.5.0,<8.0.0",
  "pytest>=9.1.1,<10.0.0",
  "ruff>=0.11.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["."]
path_separator = "os"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
