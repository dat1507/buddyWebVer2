name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Disposable runner-local database for Recap migration/API acceptance, never Production.
    services:
      recap-postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: buddy_recap_local
          POSTGRES_PASSWORD: recap-ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d buddy_recap_local"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RECAP_TEST_DATABASE_URL: postgresql+asyncpg://postgres:recap-ci-disposable-only@127.0.0.1:5432/buddy_recap_local

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Install locked dependencies
        working-directory: apps/api
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Check dependency consistency
        working-directory: apps/api
        run: python -m pip check

      - name: Lint
        working-directory: apps/api
        run: ruff check .

      - name: Type-check
        working-directory: apps/api
        run: mypy app alembic tests

      - name: Run tests
        working-directory: apps/api
        run: pytest

      - name: Check Alembic graph
        working-directory: apps/api
        run: |
          python -m alembic -c pyproject.toml history
          python -m alembic -c pyproject.toml heads

      - name: Build package
        working-directory: apps/api
        run: python -m build --no-isolation

      - name: Audit runtime dependencies
        working-directory: apps/api
        run: python -m pip_audit --strict -r requirements.lock

      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only
          DATABASE_URL: postgresql+asyncpg://vgu_buddy_runtime:ci-runtime-only@postgres:5432/vgu_buddy?sslmode=disable
          DATABASE_MIGRATION_URL: postgresql+asyncpg://postgres:ci-compose-validation-only@postgres:5432/vgu_buddy?sslmode=disable
          LOCAL_RUNTIME_DATABASE_PASSWORD: ci-runtime-only
          AUTH_JWT_SECRET: compose-jwt-validation-placeholder
          AUTH_CSRF_SECRET: compose-csrf-validation-placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SECRET_KEY: ci-placeholder
          RESEND_API_KEY: ci-placeholder
          EMAIL_FROM_ADDRESS: no-reply@example.test
          PUBLIC_APP_BASE_URL: https://example.test
          EMAIL_VERIFICATION_SEALING_KEY: compose-sealing-validation-placeholder
        run: docker compose -f docker-compose.yml config --quiet
