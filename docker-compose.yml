name: vgu-buddy

x-backend-environment: &backend-environment
  APP_ENV: local
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in apps/api/.env with host postgres}
  REDIS_URL: redis://redis:6379/0
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-vgu-buddy:local:ops:v1}
  RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
  RATE_LIMIT_KEY_PREFIX: ${RATE_LIMIT_KEY_PREFIX:-vgu-buddy:local:auth:v1}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in apps/api/.env}
  AUTH_CSRF_SECRET: ${AUTH_CSRF_SECRET:?Set AUTH_CSRF_SECRET in apps/api/.env}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in apps/api/.env}
  SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY in apps/api/.env}
  RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in apps/api/.env}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?Set EMAIL_FROM_ADDRESS in apps/api/.env}
  PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:?Set PUBLIC_APP_BASE_URL in apps/api/.env}
  EMAIL_VERIFICATION_SEALING_KEY: ${EMAIL_VERIFICATION_SEALING_KEY:?Set EMAIL_VERIFICATION_SEALING_KEY in apps/api/.env}

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vgu_buddy}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apps/api/.env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 256mb

  redis:
    image: redis:7.4.2-alpine@sha256:519f0189dfdee3bc0bad61fb265fe73d864b5c64020e6579ad48a45c49965635
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    build:
      context: ./apps/api
    command: ["python", "-m", "alembic", "-c", "pyproject.toml", "upgrade", "head"]
    environment:
      APP_ENV: local
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?Set DATABASE_MIGRATION_URL in apps/api/.env with host postgres}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  runtime-role:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.cli", "configure-local-runtime-role"]
    environment:
      APP_ENV: local
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?Set DATABASE_MIGRATION_URL in apps/api/.env with host postgres}
      LOCAL_RUNTIME_DATABASE_PASSWORD: ${LOCAL_RUNTIME_DATABASE_PASSWORD:?Set LOCAL_RUNTIME_DATABASE_PASSWORD in apps/api/.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: ./apps/api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      runtime-role:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.cli", "email-worker"]
    environment:
      <<: *backend-environment
    depends_on:
      runtime-role:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  web:
    build:
      context: ./apps/web
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8000}/api
      VITE_EVENT_SLIDER_USE_MOCKS: "false"
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
